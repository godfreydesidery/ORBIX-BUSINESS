<div class="modal fade" id="parkingZone-modal" data-backdrop="static" tabindex="-1" role="dialog" aria-labelledby="modal-large-label" style="top: 0;">
    <div class="modal-dialog modal-xl" role="document" style="top: 0;">
        <div class="modal-content">
            <div class="modal-header state modal-default">                                    
                <h4 class="modal-title" id="modal-large-label">Vehicle Registration</h4>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">×</span></button>
            </div>
            <div class="modal-body">
                <h6>Driver/Owner Information</h6><hr>
                <div class="row">
                    <!-- <input type="hidden" [(ngModel)]="id"> -->
                    <div class="col-lg-3">
                        <div class="form-group">
                            <label>First Name</label>
                            <input class="form-control" type="text" autocomplete="nope">
                        </div>
                    </div>     
                    <div class="col-lg-3">
                        <div class="form-group">
                            <label>Middle Names</label>
                            <input class="form-control" type="text" autocomplete="nope">
                        </div>
                    </div> 
                    <div class="col-lg-3">
                        <div class="form-group">
                            <label>Last Name</label>
                            <input class="form-control" type="text" autocomplete="nope">
                        </div>
                    </div>   
                    <div class="col-lg-3">
                        <div class="form-group">
                            <label>ID No</label>
                            <input class="form-control" type="text" autocomplete="nope">
                        </div>
                    </div> 
                    <div class="col-lg-3">
                        <div class="form-group">
                            <label>Phone No</label>
                            <input class="form-control" type="tel" autocomplete="nope">
                        </div>
                    </div> 
                    <div class="col-lg-3">
                        <div class="form-group">
                            <label>Email</label>
                            <input class="form-control" type="email" autocomplete="nope">
                        </div>
                    </div>                     
                </div>

                <h6>Agent Information</h6><hr>
                <div class="row">
                    <!-- <input type="hidden" [(ngModel)]="id"> -->
                    <div class="col-lg-6">
                        <div class="form-group">
                            <label>Agent Name</label>
                            <input class="form-control" type="text" autocomplete="nope">
                        </div>
                    </div>     
                    <div class="col-lg-3">
                        <div class="form-group">

                            <input class="form-control" type="text" autocomplete="nope">
                        </div>
                    </div> 
                    <div class="col-lg-3">
