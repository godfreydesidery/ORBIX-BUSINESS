<div class="row bottom-30">
  <div class="col">
    <div widget class="card">
      <div class="card-header">
        <span>Vehicle Archive Report</span>
      </div>

      <div class="card-body widget-body text-white">
        <div class="row">
          <div class="col-lg-3">
            <div class="form-group">
              <label class="form-control">From</label>
              <input type="date" class="form-control" [(ngModel)]="from" />
            </div>
          </div>

          <div class="col-lg-3">
            <div class="form-group">
              <label class="form-control">To</label>
              <input type="date" class="form-control" [(ngModel)]="to" />
            </div>
          </div>

          <!--
          <div class="col-lg-3">
            <div class="form-group">
              <label class="form-control">Cashier Name</label>
              <select class="form-control" [(ngModel)]="nickname">
                <option></option>
                <option *ngFor="let cashier of userNames">{{ cashier }}</option>
              </select>
            </div>
          </div>
          -->

          <div class="col-lg-3">
            <div class="form-group">
              <button
                class="btn btn-outline-success btn-round-custom"
                (click)="getRegistationByDate(from, to)"
              >
                <i class="fa fa-refresh"></i> Run Report
              </button>

              <button
                class="btn btn-outline-success btn-round-custom"
                (click)="printStorageReport()"
                style="padding-left: 3px;"
              >
                <i class="fa fa-file-pdf-o"></i> Print Report
              </button>

              <button
                class="btn btn-outline-success btn-round-custom"
                (click)="exportToExcel()"
                style="padding-left: 3px;"
              >
                <i class="fa fa-file-excel-o"></i> Excel
              </button>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-lg-12" *ngIf="vehicleEquipmentRemovedReports.length > 0">
            <div class="table-responsive table-striped table-sm table-bordered">
              <table class="table">
                <thead>
                  <td><b>SN</b></td>
                  <td><b>Owner Name</b></td>
                  <td><b>Phone No</b></td>
                  <td><b>Vehicle Name</b></td>
                  <td><b>Price</b></td>
                  <td><b>Reg No</b></td>
                  <td><b>Reason</b></td>
                  <td><b>Date Time</b></td>
                  <td><b>Registered By</b></td>
                  <td><b>Archived By</b></td>
                </thead>

                <tbody>
                  <tr *ngFor="let r of vehicleEquipmentRemovedReports">
                    <td>{{ r.sn }}</td>
                    <td>{{ r.ownerName }}</td>
                    <td>{{ r.phoneNo }}</td>
                    <td>{{ r.vehicleName }}</td>
                    <td>{{ r.price }}</td>
                    <td>{{ r.regNo }}</td>
                    <td>{{ r.reason }}</td>
                    <td>{{ r.dateTime }}</td>
                    <td>{{ r.registeredBy }}</td>
                    <td>{{ r.removedBy }}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <div class="col-lg-12" *ngIf="vehicleEquipmentRemovedReports.length == 0">
            <div class="alert alert-info" style="text-align: center;">
              No data
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
