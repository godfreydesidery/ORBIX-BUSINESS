<div class="row bottom-30">
    <div class="col">
        <div widget class="card">
            <div class="card-header">
                <span>Restaurant Stock Card Report</span>
            </div>
            <div class="card-body widget-body text-white">

                <div class="row">
                    <div class="col-lg-3">
                        <div class="form-group">
                            <label class="form-control">From</label>
                            <input type="date" class="form-control" [(ngModel)]="from">
                        </div>
                    </div>
                    <div class="col-lg-3">
                        <div class="form-group">
                            <label class="form-control">To</label>
                            <input type="date" class="form-control" [(ngModel)]="to">
                        </div>
                    </div>

                    <div class="col-lg-3">
                        <div class="form-group">
                            <label class="form-control">Filter By Product</label>
                            <div class="dropdown">
                                <input type="text" id="dineableSearch" class="form-control" [(ngModel)]="searchTerm"
                                    (input)="searchProducts()" (focus)="isDropdownOpen = true"
                                    style="font-weight: bold;" placeholder="Type to search Product..."
                                    autocomplete="off" />
                                <div class="dropdown-menu show mt-1"
                                    *ngIf="isDropdownOpen && filteredProducts.length > 0"
                                    style="max-height: 200px; overflow-y: auto; width: 100%;">
                                    <button class="dropdown-item form-control" style="font-weight: bold;"
                                        *ngFor="let product of filteredProducts" (click)="selectProduct(product)">
                                        {{ product.name }}
                                    </button>
                                </div>

                                <!-- <div class="dropdown-menu show mt-1 text-muted"
                                    *ngIf="isDropdownOpen && searchProducts.length === 0">
                                    No dineables found.
                                </div> -->
                            </div>
                        </div>

                    </div>
                    <!-- <div class="col-lg-3">
                        <div class="form-group">
                            <label class="form-control">Cashier Name</label>
                            <select class="form-control" [(ngModel)]="nickname">
                                <option></option>
                                <option *ngFor="let cashier of userNames">{{cashier}}</option>
                            </select>
                        </div>
                    </div> -->
                    <div class="col-lg-3">
                        <div class="form-group">
                            <!-- <br><br> -->
                            <button class="btn btn-outline-success btn-round-custom"
                                (click)="getStockLogByDate(from, to)">Run Report</button>
                            <button class="btn btn-outline-primary btn-round-custom" (click)="printReport()"
                                style="padding-left: 3px;">Print Report</button>

                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-lg-12" *ngIf="fastMovingProducts.length > 0">
                        <div class="table-responsive">
                            <table class="table table-striped table-bordered table-sm">
                                <thead>
                                    <td><b>SN</b></td>
                                    <td><b>Date Time</b></td>
                                    <td><b>Product Name</b></td>
                                    <td><b>Original Qty</b></td>
                                    <td><b>Qty In</b></td>
                                    <td><b>Qty Out</b></td>
                                    <td><b>Balance</b></td>
                                    <td><b>Logged By</b></td>
                                    <td><b>Reference</b></td>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let s of fastMovingProducts">
                                        <td>{{s.sn}}</td>
                                        <td class="text-primary" style="font-weight: bold;">{{s.dateTime}}</td>
                                        <td>{{s.productName}}</td>
                                        <td class="text-danger" style="font-weight: bold;">{{s.orgQty}}</td>
                                        <td class="text-success" style="font-weight: bold;">{{s.qtyIn}}</td>
                                        <td class="text-primary" style="font-weight: bold;">{{s.qtyOut}}</td>
                                        <td class="text-danger" style="font-weight: bold;">{{s.balance}}</td>
                                        <td>{{s.nickname}}</td>
                                        <td>{{s.reference}}</td>
                                    </tr>
                                </tbody>

                            </table>
                        </div>

                    </div>
                    <div class="col-lg-12" *ngIf="fastMovingProducts.length == 0">
                        <div class="alert alert-info" *ngIf="fastMovingProducts.length == 0"
                            style="text-align: center;">
                            No Data
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
