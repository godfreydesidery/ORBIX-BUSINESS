<div class="row bottom-30">
    <div class="col">
        <div widget class="card">
            <div class="card-header">
                <span>Sales Listing Report</span>                       
            </div>
            <div class="card-body widget-body text-white"> 

                <div class="row">
                    <div class="col-lg-3">
                        <div class="form-group">
                            <label class="form-control">From</label>
                            <input type="date" class="form-control" [(ngModel)]="from">
                        </div>
                    </div>
                    <div class="col-lg-3">
                        <div class="form-group">
                            <label class="form-control">To</label>
                            <input type="date" class="form-control" [(ngModel)]="to">
                        </div>
                    </div>
                    <!-- <div class="col-lg-3">
                        <div class="form-group">
                            <label class="form-control">Cashier Name</label>
                            <select class="form-control" [(ngModel)]="nickname">
                                <option></option>
                                <option *ngFor="let cashier of userNames">{{cashier}}</option>
                            </select>
                        </div>
                    </div> -->
                    <div class="col-lg-3">
                        <div class="form-group">
                            <!-- <br><br> -->
                            <button class="btn btn-outline-success btn-round-custom" (click)="getSalesListingByDate(from, to)">Run Report</button>
                            <button class="btn btn-outline-primary btn-round-custom" (click)="printReport()" style="padding-left: 3px;">Print Report</button>
                        
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-lg-12" *ngIf="salesListings.length > 0">
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <td><b>SN</b></td>
                                    <td><b>Product Name</b></td>
                                    <td><b>Qty</b></td>
                                    <td><b>Amount</b></td>
                                    <td><b>Created By</b>
                                    <td><b>Date Time></b>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let s of salesListings">
                                        <td>{{s.sn}}</td>
                                        <td>{{s.productName}}</td>
                                        <td>{{s.qty}}</td>
                                        <td style="text-align: right;">{{s.amount | currency:'':''}}</td>
                                        <td>{{s.createdBy}}</td>  
                                        <td>{{s.timeDate}}</td>                                      
                                    </tr>
                                </tbody>
                                <tfoot>
                                    <tr>
                                        <td colspan="3"><b>Total</b></td>
                                        <td style="text-align: right;"><b>{{total | currency:'':''}}</b></td>
                                        <td colspan="2"></td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>

                    </div>
                    <div class="col-lg-12" *ngIf="salesListings.length == 0">
                        <div class="alert alert-info" *ngIf="salesListings.length == 0" style="text-align: center;">
                            No Data
                        </div>
                    </div>                    
                </div>
            </div>
        </div>
    </div>
</div>
