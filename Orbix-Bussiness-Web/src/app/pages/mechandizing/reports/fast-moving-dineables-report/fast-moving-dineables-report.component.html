<div class="row bottom-30">
    <div class="col">
        <div widget class="card">
            <div class="card-header">
                <span>Fast Moving Dineables Report</span>                       
            </div>
            <div class="card-body widget-body text-white"> 

                <div class="row">
                    <div class="col-lg-3">
                        <div class="form-group">
                            <label class="form-control">From</label>
                            <input type="date" class="form-control" [(ngModel)]="from">
                        </div>
                    </div>
                    <div class="col-lg-3">
                        <div class="form-group">
                            <label class="form-control">To</label>
                            <input type="date" class="form-control" [(ngModel)]="to">
                        </div>
                    </div>
                    <!-- <div class="col-lg-3">
                        <div class="form-group">
                            <label class="form-control">Cashier Name</label>
                            <select class="form-control" [(ngModel)]="nickname">
                                <option></option>
                                <option *ngFor="let cashier of userNames">{{cashier}}</option>
                            </select>
                        </div>
                    </div> -->
                    <div class="col-lg-3">
                        <div class="form-group">
                            <!-- <br><br> -->
                            <button class="btn btn-outline-success btn-round-custom" (click)="getFastMovingDineablesByDate(from, to)">Run Report</button>
                            <button class="btn btn-outline-primary btn-round-custom" (click)="printReport()" style="padding-left: 3px;">Print Report</button>
                        
                        </div>
                    </div>
                    <div class="col-lg-3" *ngIf="fastMovingDineables.length > 0">
                        <div class="form-group">
                            <label class="form-control text-primary" style="font-weight: bolder;">Overall Total</label>
                            <span class="form-control text-primary" style="font-weight: bolder;">{{total | currency:'':''}}</span>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-lg-12" *ngIf="fastMovingDineables.length > 0">
                        <div class="table-responsive table-striped table-sm table-bordered">
                            <table class="table">
                                <thead>
                                    <td><b>SN</b></td>
                                    <td><b>Dineable Name</b></td>
                                    <td><b>Qty</b></td>
                                    <td><b>Amount</b></td>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let s of fastMovingDineables">
                                        <td>{{s.sn}}</td>
                                        <td>{{s.dineableName}}</td>
                                        <td class="text-danger" style="font-weight: bold;">{{s.qty}}</td>
                                        <td style="text-align: right;">{{s.amount | currency:'':''}}</td>                                  
                                    </tr>
                                </tbody>
                                <tfoot>
                                    <tr>
                                        <td colspan="3"><b>Total</b></td>
                                        <td class="text-primary" style="text-align: right; font-weight: bolder;"><b>Overall Total: {{total | currency:'':''}}</b></td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>

                    </div>
                    <div class="col-lg-12" *ngIf="fastMovingDineables.length == 0">
                        <div class="alert alert-info" *ngIf="fastMovingDineables.length == 0" style="text-align: center;">
                            No Data
                        </div>
                    </div>                    
                </div>
            </div>
        </div>
    </div>
</div>
