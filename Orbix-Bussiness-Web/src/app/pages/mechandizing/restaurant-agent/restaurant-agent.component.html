<div class="row bottom-30">
    <div class="col">
        <div widget class="card">
            <div class="card-header">
                <span>Restaurant Name: {{selectedRestaurant.name}}</span>
            </div>
            <div class="card-body widget-body">
                <div class="row">
                    <div class="col-md-12">
                        <button class="btn btn-success btn-round-custom" (click)="clearAgent()" data-toggle="modal"
                            data-target="#agent-modal">New Agent</button>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-12">
                        <br><br>
                        <div class="row">
                            <div class="col-sm-4"></div>
                            <div class="col-sm-8">
                                <input type="text" class="form-control pull-right" [(ngModel)]="filterRecords"
                                    placeholder="Search..." style="max-width: 8cm;">
                            </div>
                        </div>
                        <br>

                        <table class="table table-striped table-bordered table-sm">
                            <thead>
                                <tr>
                                    <th scope="col">SN</th>
                                    <th scope="col">Name</th>
                                    <th scope="col">Phone No</th>
                                    <th scope="col">Assigned Badge</th>
                                    <th scope="col">Is Active?</th>
                                    <th scope="col">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr
                                    *ngFor="let agent of restaurantAgents | searchFilter : filterRecords | paginate: { itemsPerPage: 15, currentPage: page }">
                                    <td>{{agent.sn}}</td>
                                    <td style="font-weight: bold; font-size: large;">{{agent.name}}</td>
                                    <td style="font-weight: bold; font-size: large;">{{agent.phoneNo}}</td>
                                    <td style="font-weight: bold; font-size: large; color: red;">
                                        {{agent.restaurantBadgeCode}}</td>
                                    <td>{{agent.activeStatus}}</td>
                                    <td>
                                        <span *ngIf="agent.activeStatus ==='Active'">Lock__</span><span
                                            *ngIf="agent.activeStatus ==='Inactive'">Unlock</span> |
                                        <button *ngIf="agent.activeStatus ==='Active'" (click)="deactivate(agent.id)"><i
                                                class="fa fa-unlock text-success"></i></button>
                                        <button *ngIf="agent.activeStatus ==='Inactive'" (click)="activate(agent.id)"><i
                                                class="fa fa-lock text-danger"></i></button>

                                        <button class="btn btn-outline-primary btn-sm btn-round-custom" *ngIf="agent.restaurantBadgeCode === ''" data-toggle="modal"
                                            data-target="#agent-badge-modal"
                                            (click)="loadAvailableBadgesByRestaurant(agent.id)">Assign Badge</button>
                                        <button class="btn btn-outline-primary btn-sm btn-round-custom" *ngIf="agent.restaurantBadgeCode != ''"
                                            (click)="unassignRestaurantBadge(agent.id)">Unassign Badge</button>
                                    </td>
                                </tr>
                            </tbody>

                            <!-- <tbody>
                                <tr *ngFor="let dineable of importDineables | searchFilter : filterRecords | paginate: { itemsPerPage: 15, currentPage: page }">
                                    <td>{{dineable.code}}</td>
                                    <td>{{dineable.name}}</td>
                                    <td>{{dineable.description}}</td>
                                    <td>{{dineable.active}}</td>
                                    <td>{{dineable.baseUom}}</td>
                                    <td>
                                        <button class="btn btn-primary btn-round-custom" *ngIf="dineable.imported == '0'" (click)="searchDineable(dineable.id)" data-toggle="modal" data-target="#import-modal">Import</button>
                                        <span class="agent" *ngIf="dineable.imported == '1'">Imported</span>
                                    </td>
                                </tr>
                            </tbody> -->
                        </table>
                        <br>
                        <div class="row">
                            <div class="col-sm-12" style="text-align: right;">
                                <pagination-controls (pageChange)="page = $event"></pagination-controls>
                            </div>
                        </div>
                    </div>
                </div>


            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="agent-modal" data-backdrop="static" tabindex="-1" role="dialog"
    aria-labelledby="modal-large-label" style="top: 0;">
    <div class="modal-dialog modal-md" role="document" style="top: 0;">
        <div class="modal-content">
            <div class="modal-header state modal-default">
                <h4 class="modal-title" id="modal-large-label">Create New Agent</h4>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span
                        aria-hidden="true">×</span></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-lg-12">
                        <input type="hidden" [(ngModel)]="restaurantAgentId">
                        <div class="form-group">
                            <label>Agent Name</label>
                            <input class="form-control" type="text" [(ngModel)]="restaurantAgentName"
                                autocomplete="nope">
                        </div>
                        <div class="form-group">
                            <label>Agent Phone No</label>
                            <input class="form-control" type="text" [(ngModel)]="restaurantAgentPhone"
                                autocomplete="nope">
                        </div>
                        <div class="form-group">
                            <button class="btn btn-success btn-round-custom btn-sm pull-right"
                                (click)="saveRestaurantAgent()" data-dismiss="modal">Save</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="agent-badge-modal" data-backdrop="static" tabindex="-1" role="dialog"
    aria-labelledby="modal-large-label" style="top: 0;">
    <div class="modal-dialog modal-md" role="document" style="top: 0;">
        <div class="modal-content">
            <div class="modal-header state modal-default">
                <h4 class="modal-title" id="modal-large-label">Assign Badge to Agent</h4>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span
                        aria-hidden="true">×</span></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-lg-12">
                        <input type="hidden" [(ngModel)]="restaurantAgentId">
                        <div class="form-group">
                            <label>Select Badge</label>
                            <select class="form-control" [(ngModel)]="selectedBadgeId">
                                <option *ngFor="let availableBadge of availableBadges" [value]="availableBadge.id">
                                    {{availableBadge.code}}
                                </option>
                            </select>
                        </div>
                        <hr>
                        <div class="form-group">
                            <button class="btn btn-success btn-round-custom btn-sm pull-right" data-dismiss="modal"
                                (click)="assignBadge()">Assign</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
