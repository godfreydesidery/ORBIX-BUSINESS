<div class="row">
    <div class="col-md-12">
        <h5>Shop Name: {{selectedShop.name}}</h5>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <button class="btn btn-success btn-round-custom" data-toggle="modal" data-target="#import-modal">New Product</button>
        <button class="btn btn-success btn-round-custom">Refresh Stock</button>
        <button class="btn btn-success btn-round-custom">Print Stock Report</button>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <p>Product List</p>
    </div>
</div>
<div class="row">
    <div class="col-md-12">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th scope="col">Code</th>
                    <th scope="col">Name</th>
                    <th scope="col">Stock</th>
                    <th scope="col">VAT%</th>
                </tr>
            </thead>
            <!-- <tbody>
                <tr *ngFor="let product of productStockStatus">
                    <td>{{product.productName}}</td>
                    <td>{{product.productCode}}</td>
                    <td>{{product.availableStock}}</td>
                </tr>
            </tbody> -->
        </table>
    </div>
</div>


<div class="modal fade" id="import-modal" data-backdrop="static" tabindex="-1" role="dialog" aria-labelledby="modal-large-label" style="top: 0;">
    <div class="modal-dialog modal-xl" role="document" style="top: 0;">
        <div class="modal-content">
            <div class="modal-header state modal-default">                                    
                <h4 class="modal-title" id="modal-large-label">Import New Product</h4>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">×</span></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-lg-6">
                        <input type="hidden" [(ngModel)]="productId">
                       <div class="form-group">
                            <!-- <label>Name (Type to Search)</label>
                            <input class="form-control" type="text" [(ngModel)]="productName" (ngModelChange)="getCompanyProductLike($event)" list="productList" autocomplete="nope">
                            <datalist id="productList">
                                <option *ngFor="let product of searchedProducts" [value]="product.name" (change)="searchProduct(product.id)" ></option>
                            </datalist> -->

                            <label>(Type to Search by Name or Code)</label>
                            <input 
                              class="form-control" 
                              type="text" 
                              [(ngModel)]="searchKey" 
                              (ngModelChange)="onInputChange($event)" 
                              (change)="onProductSelected()" 
                              list="productList" 
                              autocomplete="off">
                            <datalist id="productList" *ngIf="searchedProducts.length > 0">
                              <option *ngFor="let product of searchedProducts" [value]="product.name"></option>
                            </datalist>


                        </div>
                        <hr>
                        <div class="form-group">
                            <label>Product Code</label>
                            <input class="form-control" type="text" [(ngModel)]="productCode" autocomplete="nope" readonly>
                        </div> 
                        <div class="form-group">
                            <label>Product Name</label>
                            <input class="form-control" type="text" [(ngModel)]="productName" autocomplete="nope" readonly>
                        </div> 
                        <div class="form-group">
                            <label>VAT(0-100)%</label>
                            <input class="form-control" type="number" [(ngModel)]="productName" autocomplete="nope">
                        </div>  
                        <div class="form-group">
                            <label>Cost Price Vat Inclusive</label>
                            <input class="form-control" type="number" [(ngModel)]="productName" autocomplete="nope">
                        </div>
                        <div class="form-group">
                            <label>Selling Price Vat Inclusive</label>
                            <input class="form-control" type="number" [(ngModel)]="productName" autocomplete="nope">
                        </div>                     
                    </div>
                    <div class="col-lg-6">
                        <div class="form-group">
                             <label>Minimum Stock Level</label>
                            <input class="form-control" type="text" [(ngModel)]="productName" autocomplete="nope">
                        </div>
                        <div class="form-group">
                            <label>Maximum Stock Level</label>
                            <input class="form-control" type="number" [(ngModel)]="productName" autocomplete="nope">
                        </div> 
                        <div class="form-group">
                            <label>Default Reorder Qty</label>
                            <input class="form-control" type="number" [(ngModel)]="productName" autocomplete="nope">
                        </div> 
                        <div class="form-group">
                            <label>Default Reorder Level</label>
                            <input class="form-control" type="number" [(ngModel)]="productName" autocomplete="nope">
                        </div>                       
                     </div>
                </div>
                
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-dismiss="modal" (click)="saveProduct()">Save Product</button>
                <button type="button" class="btn btn-danger" data-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>
