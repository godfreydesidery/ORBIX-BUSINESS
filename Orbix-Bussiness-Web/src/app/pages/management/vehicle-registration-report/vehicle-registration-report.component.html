<div class="row bottom-30">
    <div class="col">
        <div widget class="card">
            <div class="card-header">
                <span>Vehicle Registration Report</span>                       
            </div>
            <div class="card-body widget-body text-white"> 

                <div class="row">
                    <div class="col-lg-3">
                        <div class="form-group">
                            <label class="form-control">From</label>
                            <input type="date" class="form-control" [(ngModel)]="from">
                        </div>
                    </div>
                    <div class="col-lg-3">
                        <div class="form-group">
                            <label class="form-control">To</label>
                            <input type="date" class="form-control" [(ngModel)]="to">
                        </div>
                    </div>
                    <div class="col-lg-3">
                        <div class="form-group">
                            <label class="form-control">Register Name</label>
                            <select class="form-control" [(ngModel)]="nickname">
                                <option></option>
                                <option *ngFor="let cashier of userNames">{{cashier}}</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-lg-3">
                        <div class="form-group">
                            <br><br>
                            <button class="btn btn-outline-success btn-round-custom" (click)="getRegistationByDate(from, to)"><i class="fa fa-refresh"></i> Run Report</button>
                            <button class="btn btn-outline-primary btn-round-custom" (click)="print()" style="padding-left: 3px;"><i class="fa fa-print"></i> Print Report</button>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-lg-12" *ngIf="registrations.length > 0">
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <td><b>SN</b></td>
                                    <td><b>Chassis No</b></td>
                                    <td><b>Vehicle Type</b></td>
                                    <td><b>Key Status</b></td>
                                    <td><b>Reg Date</b></td>
                                    <td><b>Reg By</b></td>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let r of registrations">
                                        <td>{{r.sn}}</td>
                                        <td>{{r.chassisNo}}</td>
                                        <td>{{r.vehicleType}}</td>
                                        <td>{{r.keyStatus}}</td>
                                        <td>{{r.registeredDate}}</td>
                                        <td>{{r.registeredBy}}</td>
                                    </tr>
                                </tbody>
                                <!-- <tfoot>
                                    <tr>
                                        <td colspan="2"><b>Total</b></td>
                                        <td style="text-align: right;"><b>{{totalCollections | currency:'':''}}</b></td>
                                        <td colspan="2"></td>
                                    </tr>
                                </tfoot> -->
                            </table>
                        </div>

                    </div>
                    <div class="col-lg-12" *ngIf="registrations.length == 0">
                        <div class="alert alert-info" *ngIf="registrations.length == 0" style="text-align: center;">
                            No data
                        </div>
                    </div>
                    
                </div>

            </div>
        </div>
    </div>
</div>
