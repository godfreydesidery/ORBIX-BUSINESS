<div class="row bottom-30">
    <div class="col">
        <div widget class="card">
            <div class="card-header">
                <span>Management Board</span>
            </div>
            <div class="card-body widget-body text-white">

                <div class="row">
                    <div class="col-lg-3">
                        <div class="form-group">
                            <label class="form-control">From</label>
                            <input type="date" class="form-control" [(ngModel)]="from">
                        </div>
                    </div>
                    <div class="col-lg-3">
                        <div class="form-group">
                            <label class="form-control">To</label>
                            <input type="date" class="form-control" [(ngModel)]="to">
                        </div>
                    </div>
                    <div class="col-lg-3">
                        <div class="form-group">
                            <br><br>
                            <button class="btn btn-success btn-round-custom" (click)="getTotalsByDates(from, to)"><i
                                    class="fa fa-refresh"></i> Update</button>
                            <!-- <button class="btn btn-success" (click)="exportToPdf()" style="margin: 3px;">Test</button> -->
                        </div>
                    </div>
                </div>
                <hr>

                <div class="row">
                    <div class="col-lg-3" style="padding: 2px;">
                        <div class="card-deck-wrapper">
                            <div class="card-deck">
                                <div class="card card-info">
                                    <div class="card-body" style="text-align: center;">
                                        <h4 class="card-title"><i class="fa fa-group"></i></h4>
                                        <h4 class="card-title">Registered Vehicles</h4>
                                        <h1 class="card-title">{{registered}}</h1>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-3" style="padding: 2px;">
                        <div class="card-deck-wrapper">
                            <div class="card-deck">
                                <div class="card card-info">
                                    <div class="card-body" style="text-align: center;">
                                        <h4 class="card-title"><i class="fa fa-group"></i></h4>
                                        <h4 class="card-title">Paid Vehicles</h4>
                                        <h1 class="card-title">{{paid}}</h1>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-3" style="padding: 2px;">
                        <div class="card-deck-wrapper">
                            <div class="card-deck">
                                <div class="card card-info">
                                    <div class="card-body" style="text-align: center;">
                                        <h4 class="card-title"><i class="fa fa-group"></i></h4>
                                        <h4 class="card-title">Checked Out Vehicles</h4>
                                        <h1 class="card-title">{{checkedOut}}</h1>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-3" style="padding: 2px;">
                        <div class="card-deck-wrapper">
                            <div class="card-deck">
                                <div class="card card-info">
                                    <div class="card-body" style="text-align: center;">
                                        <h4 class="card-title"><i class="fa fa-group"></i></h4>
                                        <h4 class="card-title">Current Unpaid Vehicles</h4>
                                        <h1 class="card-title">{{currentUnpaid}}</h1>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-3" style="padding: 2px;">
                        <div class="card-deck-wrapper">
                            <div class="card-deck">
                                <div class="card card-info">
                                    <div class="card-body" style="text-align: center;">
                                        <h4 class="card-title"><i class="fa fa-group"></i></h4>
                                        <h4 class="card-title">Current Vehicles in Yards</h4>
                                        <h1 class="card-title">{{currentTotalInYards}}</h1>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-3" style="padding: 2px;">
                        <div class="card-deck-wrapper">
                            <div class="card-deck">
                                <div class="card card-info">
                                    <div class="card-body" style="text-align: center;">
                                        <h4 class="card-title"><i class="fa fa-group"></i></h4>
                                        <h4 class="card-title">Shop Sales</h4>
                                        <h1 class="card-title">NA</h1>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-3" style="padding: 2px;">
                        <div class="card-deck-wrapper">
                            <div class="card-deck">
                                <div class="card card-info">
                                    <div class="card-body" style="text-align: center;">
                                        <h4 class="card-title"><i class="fa fa-group"></i></h4>
                                        <h4 class="card-title">Total Goods</h4>
                                        <h1 class="card-title">NA</h1>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!--  -->

                <div class="row">
                    <div class="col-sm-3">
                        <br>
                        <select class="form-control">
                            <option>2025</option>
                        </select>
                        <br>
                    </div>
                </div>
                <div class="row">
                    <div class="col-xl-6 col-lg-6 col-12 bottom-30">
                        <div widget class="card">
                            <div class="card-header">
                                <span>Parking Summary</span>
                                <div class="widget-controls">
                                    <a data-widgster="expand" href="#" class="transition"><i
                                            class="fa fa-chevron-down"></i></a>
                                    <a data-widgster="collapse" href="#" class="transition"><i
                                            class="fa fa-chevron-up"></i></a>
                                    <a data-widgster="close" href="#" class="transition"><i class="fa fa-times"></i></a>
                                </div>
                            </div>
                            <div class="card-body widget-body">
                                <canvas baseChart [data]="verticalBarChartData" [options]="verticalBarChartOptions"
                                    [plugins]="verticalBarChartPlugins" [legend]="verticalBarChartLegend"
                                    [type]="verticalBarChartType" (chartHover)="chartHovered($event)"
                                    (chartClick)="chartClicked($event)">
                                </canvas>
                            </div>
                        </div>
                    </div>

                    <div class="col-xl-6 col-lg-6 col-12 bottom-30">
        <div widget class="card">
            <div class="card-header">
                <span>Storage Summary</span>
                <div class="widget-controls">              
                    <a data-widgster="expand" href="#" class="transition"><i class="fa fa-chevron-down"></i></a>
                    <a data-widgster="collapse" href="#" class="transition"><i class="fa fa-chevron-up"></i></a>              
                    <a data-widgster="close" href="#" class="transition"><i class="fa fa-times"></i></a>
                </div>        
            </div>
            <div class="card-body widget-body">
                <canvas baseChart
                        [type]="lineChartType"
                        [data]="lineChartData"
                        [legend]="lineChartLegend"
                        [options]="lineChartOptions" 
                        (chartHover)="chartHovered($event)"
                        (chartClick)="chartClicked($event)">
                </canvas>
            </div>
        </div>
    </div>

                </div>

                

                <!--  -->

            </div>
        </div>
    </div>
</div>
