


<div class="row bottom-30">
    <div class="col">
        <div widget class="card">
            <div class="card-header">
                <span>Supplier List</span>
            </div>
            <div class="card-body widget-body"> 

                <div class="row">
                    <div class="col-sm-12">
                        <button type="button" class="btn btn-outline-success btn-round-custom" (click)="clearSupplierData()" data-toggle="modal" data-target="#company-modal">New Supplier</button>
                    <br><br>
                    </div>
                </div>

                <div class="row">
                    <div class="col-sm-4"></div>
                    <div class="col-sm-4"></div>
                    <div class="col-sm-4">
                        <input type="text" class="form-control pull-right" [(ngModel)]="filterRecords" placeholder="Search..." style="max-width: 8cm;">
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>SN</th>
                                <th>Supplier Code</th>
                                <th>Supplier Name</th>                           
                                <th>Contact Name</th>
                                <th>Address</th>
                                <th>Phone No</th>
                                <th>Active?</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>        
                            <tr *ngFor="let supplier of suppliers | searchFilter : filterRecords | paginate: { itemsPerPage: 15, currentPage: page }">
                                <td>{{supplier.sn}}</td>
                                <td>{{supplier.code}}</td>
                                <td>{{supplier.name}}</td>
                                <td>{{supplier.contactName}}</td>
                                <td>{{supplier.address}}</td>
                                <td>{{supplier.phoneNo}}</td>
                                <td>
                                    <span *ngIf="supplier.active ==='Active'">Active__</span><span *ngIf="supplier.active ==='Inactive'">Inactive </span> | 
                                    <button *ngIf="supplier.active ==='Inactive'" (click)="activate(supplier.id)"><i class="fa fa-unlock text-success"></i></button>
                                    <button *ngIf="supplier.active ==='Active'" (click)="deactivate(supplier.id)"><i class="fa fa-lock text-danger"></i></button>
                                </td>
                                <td><button type="button" class="btn btn-primary btn-round-custom" (click)="get(supplier.id)" data-toggle="modal" data-target="#company-modal" style="cursor: pointer;">Edit</button></td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="row">
                        <div class="col-sm-12" style="text-align: right;">
                            <pagination-controls (pageChange)="page = $event"></pagination-controls>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>




<div class="modal fade" id="company-modal" data-backdrop="static" tabindex="-1" role="dialog" aria-labelledby="modal-large-label" style="top: 0;">
    <div class="modal-dialog modal-xl" role="document" style="top: 0;">
        <div class="modal-content">
            <div class="modal-header state modal-default">                                    
                <h4 class="modal-title" id="modal-large-label">New/Edit Supplier</h4>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">×</span></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-lg-3">
                        <input type="hidden" [(ngModel)]="id">
                        <div class="form-group">
                            <label>Supplier Code</label>
                            <input class="form-control" type="text" [(ngModel)]="code" autocomplete="nope" readonly>
                        </div>
                        <div class="form-group">
                            <label>Supplier Name</label>
                            <input class="form-control" type="text" [(ngModel)]="name" autocomplete="nope">
                        </div>
                        <div class="form-group">
                            <label>Contact Name</label>
                            <input class="form-control" type="text" [(ngModel)]="contactName" autocomplete="nope">
                        </div>
                        <div class="form-group">
                            <label>Address</label>
                            <input class="form-control" type="text" [(ngModel)]="address" autocomplete="nope">
                        </div>
                        <div class="form-group">
                            <label>Phone No</label>
                            <input class="form-control" type="text" [(ngModel)]="phoneNo" autocomplete="nope">
                        </div>
                    </div>                   
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-dismiss="modal" (click)="save()">Save</button>
                <button type="button" class="btn btn-danger" data-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>
