


<div class="row bottom-30">
    <div class="col">
        <div widget class="card">
            <div class="card-header">
                <span>Dineable List</span>
            </div>
            <div class="card-body widget-body"> 

                <div class="row">
                    <div class="col-sm-12">
                        <button type="button" class="btn btn-outline-success btn-round-custom" (click)="clearDineableData()" data-toggle="modal" data-target="#company-modal">New Dineable</button>
                    <br><br>
                    </div>
                </div>

                <div class="row">
                    <div class="col-sm-4"></div>
                    <div class="col-sm-4"></div>
                    <div class="col-sm-4">
                        <input type="text" class="form-control pull-right" [(ngModel)]="filterRecords" placeholder="Search..." style="max-width: 8cm;">
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>SN</th>
                                <th>Dineable Code</th>
                                <th>Dineable Name</th>
                                <th>Description</th>
                                <th>Base UOM</th>
                                <th>Active?</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>        
                            <tr *ngFor="let dineable of dineables | searchFilter : filterRecords | paginate: { itemsPerPage: 15, currentPage: page }">
                                <td>{{dineable.sn}}</td>
                                <td>{{dineable.code}}</td>
                                <td>{{dineable.name}}</td>
                                <td>{{dineable.description}}</td>
                                <td>{{dineable.baseUom}}</td> 
                                <td>
                                    <span *ngIf="dineable.active ==='Active'">Lock__</span><span *ngIf="dineable.active ==='Inactive'">Unlock</span> | 
                                    <button *ngIf="dineable.active ==='Active'" (click)="deactivate(dineable.id)"><i class="fa fa-unlock text-success"></i></button>
                                    <button *ngIf="dineable.active ==='Inactive'" (click)="activate(dineable.id)"><i class="fa fa-lock text-danger"></i></button>
                                </td>
                                <td><button type="button" class="btn btn-primary btn-round-custom" (click)="get(dineable.id)" data-toggle="modal" data-target="#company-modal" style="cursor: pointer;">Edit</button></td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="row">
                        <div class="col-sm-12" style="text-align: right;">
                            <pagination-controls (pageChange)="page = $event"></pagination-controls>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>




<div class="modal fade" id="company-modal" data-backdrop="static" tabindex="-1" role="dialog" aria-labelledby="modal-large-label" style="top: 0;">
    <div class="modal-dialog modal-xl" role="document" style="top: 0;">
        <div class="modal-content">
            <div class="modal-header state modal-default">                                    
                <h4 class="modal-title" id="modal-large-label">New/Edit Dineable</h4>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">×</span></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-lg-6">
                        <input type="hidden" [(ngModel)]="id">
                        <div class="form-group">
                            <label>Dineable Code</label>
                            <input class="form-control" type="text" [(ngModel)]="code" autocomplete="nope" readonly>
                        </div>                        
                    </div> 
                    <div class="col-lg-6">
                        <div class="form-group">
                            <label>Dineable Name</label>
                            <input class="form-control" type="text" [(ngModel)]="name" autocomplete="nope">
                        </div>                       
                    </div>
                    <div class="col-lg-6">
                        <div class="form-group">
                            <label>Description</label>
                            <input class="form-control" type="text" [(ngModel)]="description" autocomplete="nope">
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="form-group">
                            <label>Base UOM</label>
                            <input class="form-control" type="text" [(ngModel)]="baseUom" autocomplete="nope">
                        </div>
                    </div>                        
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-dismiss="modal" (click)="save()">Save</button>
                <button type="button" class="btn btn-danger" data-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>
