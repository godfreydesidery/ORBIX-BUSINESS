


<div class="row bottom-30">
    <div class="col">
        <div widget class="card">
            <div class="card-header">
                <span>UOM List</span>
            </div>
            <div class="card-body widget-body"> 

                <div class="row">
                    <div class="col-sm-12">
                        <button type="button" class="btn btn-outline-success btn-round-custom" (click)="clearUomData()" data-toggle="modal" data-target="#company-modal">New UOM</button>
                    <br><br>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>SN</th>
                                <th>Uom Code</th>
                                <th>Uom Name</th>
                                <th>Type</th>
                                <th>Active?</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            @for (uom of uoms; track uom.id) {
                                <tr>
                                    <td>{{uom.sn}}</td>
                                    <td>{{uom.code}}</td>
                                    <td>{{uom.name}}</td>
                                    <td>{{uom.type}}</td>
                                    <td>
                                        <span *ngIf="uom.active ==='Active'">Active__</span><span *ngIf="uom.active ==='Inactive'">Inactive </span> | 
                                        <button *ngIf="uom.active ==='Inactive'" (click)="activate(uom.id)"><i class="fa fa-unlock text-success"></i></button>
                                        <button *ngIf="uom.active ==='Active'" (click)="deactivate(uom.id)"><i class="fa fa-lock text-danger"></i></button>
                                    </td>
                                    <td><button type="button" class="btn btn-primary btn-round-custom" (click)="get(uom.id)" data-toggle="modal" data-target="#company-modal" style="cursor: pointer;">Edit</button></td>
                                </tr>
                            }
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>




<div class="modal fade" id="company-modal" data-backdrop="static" tabindex="-1" role="dialog" aria-labelledby="modal-large-label" style="top: 0;">
    <div class="modal-dialog modal-xl" role="document" style="top: 0;">
        <div class="modal-content">
            <div class="modal-header state modal-default">                                    
                <h4 class="modal-title" id="modal-large-label">New/Edit Uom</h4>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">×</span></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-lg-3">
                        <input type="hidden" [(ngModel)]="id">
                        <div class="form-group">
                            <label>Uom Code</label>
                            <input class="form-control" type="text" [(ngModel)]="code" autocomplete="nope">
                        </div>
                        <div class="form-group">
                            <label>UOM Name</label>
                            <input class="form-control" type="text" [(ngModel)]="name" autocomplete="nope">
                        </div>
                        <div class="form-group">
                            <label>Type</label>
                            <input class="form-control" type="text" [(ngModel)]="type" autocomplete="nope">
                        </div>
                        
                    </div>                   
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-dismiss="modal" (click)="save()">Save</button>
                <button type="button" class="btn btn-danger" data-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>
