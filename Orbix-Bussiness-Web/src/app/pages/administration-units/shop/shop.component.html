


<div class="row bottom-30">
    <div class="col">
        <div widget class="card">
            <div class="card-header">
                <span>Shop List</span>
            </div>
            <div class="card-body widget-body"> 

                <div class="row">
                    <div class="col-sm-12">
                        <button type="button" class="btn btn-outline-success btn-round-custom" (click)="clearCompanyData()" data-toggle="modal" data-target="#company-modal">New Shop</button>
                    <br><br>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>SN</th>
                                <th>Shop Code</th>
                                <th>Shop Name</th>
                                <th>Other Info</th>
                                <th>Active?</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            @for (shop of shops; track shop.id) {
                                <tr>
                                    <td>{{shop.sn}}</td>
                                    <td>{{shop.code}}</td>
                                    <td>{{shop.name}}</td>
                                    <td>{{shop.otherInfo}}</td>
                                    <td>
                                        <span *ngIf="shop.active ==='Active'">Lock__</span><span *ngIf="shop.active ==='Inactive'">Unlock </span> | 
                                        <button *ngIf="shop.active ==='Active'" (click)="deactivate(shop.id)"><i class="fa fa-unlock text-success"></i></button>
                                        <button *ngIf="shop.active ==='Inactive'" (click)="activate(shop.id)"><i class="fa fa-lock text-danger"></i></button>
                                    </td>
                                    <td><button type="button" class="btn btn-primary btn-round-custom" (click)="get(shop.id)" data-toggle="modal" data-target="#company-modal" style="cursor: pointer;">Edit</button></td>
                                </tr>
                            }
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>




<div class="modal fade" id="company-modal" data-backdrop="static" tabindex="-1" role="dialog" aria-labelledby="modal-large-label" style="top: 0;">
    <div class="modal-dialog modal-xl" role="document" style="top: 0;">
        <div class="modal-content">
            <div class="modal-header state modal-default">                                    
                <h4 class="modal-title" id="modal-large-label">New/Edit Shop</h4>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">×</span></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-lg-3"></div>
                    <div class="col-lg-6">
                        <input type="hidden" [(ngModel)]="id">
                        <div class="form-group">
                            <label>Shop Code</label>
                            <input class="form-control" type="text" [(ngModel)]="code" autocomplete="nope">
                        </div>
                        <hr> 
                    </div>   
                    <div class="col-lg-6">
                        <div class="form-group">
                            <label>Shop Name</label>
                            <input class="form-control" type="text" [(ngModel)]="name" autocomplete="nope">
                        </div>
                    </div>    
                    <div class="col-lg-6">
                        <div class="form-group">
                            <label>Location</label>
                            <input class="form-control" type="text" [(ngModel)]="locationName" autocomplete="nope">
                        </div>
                    </div>                   
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-dismiss="modal" (click)="save()">Save</button>
                <button type="button" class="btn btn-danger" data-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>
