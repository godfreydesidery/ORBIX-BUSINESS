


<div class="row bottom-30">
    <div class="col">
        <div widget class="card">
            <div class="card-header">
                <span>Branch List</span>
            </div>
            <div class="card-body widget-body"> 

                <div class="row">
                    <div class="col-sm-12">
                        <button type="button" class="btn btn-outline-success btn-round-custom" (click)="clearCompanyData()" data-toggle="modal" data-target="#company-modal">New Branch</button>
                    <br><br>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>SN</th>
                                <th>Branch Code</th>
                                <th>Branch Name</th>
                                <th>Company Name</th>
                                <th>Manager Name</th>
                                <th>Active?</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            @for (branch of branches; track branch.id) {
                                <tr>
                                    <td>{{branch.sn}}</td>
                                    <td>{{branch.code}}</td>
                                    <td>{{branch.name}}</td>
                                    <td>{{branch.companyName}}</td>
                                    <td>{{branch.managerName}}</td>
                                    <td>
                                        <span *ngIf="branch.active ==='Active'">Active__</span><span *ngIf="branch.active ==='Inactive'">Inactive </span> | 
                                        <button *ngIf="branch.active ==='Inactive'" (click)="activate(branch.id)"><i class="fa fa-unlock text-success"></i></button>
                                        <button *ngIf="branch.active ==='Active'" (click)="deactivate(branch.id)"><i class="fa fa-lock text-danger"></i></button>
                                    </td>
                                    <td><button type="button" class="btn btn-primary btn-round-custom" (click)="get(branch.id)" data-toggle="modal" data-target="#company-modal" style="cursor: pointer;">Edit</button></td>
                                </tr>
                            }
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>




<div class="modal fade" id="company-modal" data-backdrop="static" tabindex="-1" role="dialog" aria-labelledby="modal-large-label" style="top: 0;">
    <div class="modal-dialog modal-xl" role="document" style="top: 0;">
        <div class="modal-content">
            <div class="modal-header state modal-default">                                    
                <h4 class="modal-title" id="modal-large-label">New/Edit Company</h4>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">×</span></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-lg-3">
                        <input type="hidden" [(ngModel)]="id">
                        <div class="form-group">
                            <label>Branch Code</label>
                            <input class="form-control" type="text" [(ngModel)]="code" autocomplete="nope" readonly>
                        </div>
                        <div class="form-group">
                            <label>Branch Name</label>
                            <input class="form-control" type="text" [(ngModel)]="name" autocomplete="nope">
                        </div>
                        <div class="form-group">
                            <label>Company Name</label>
                            <input class="form-control" type="text" [(ngModel)]="company" autocomplete="nope">
                        </div>
                        <div class="form-group">
                            <label>Manager Name</label>
                            <input class="form-control" type="text" [(ngModel)]="managerName" autocomplete="nope">
                        </div>
                        <div class="form-group">
                            <label>Opening Hours</label>
                            <input class="form-control" type="text" [(ngModel)]="openingHours" autocomplete="nope">
                        </div>
                        <div class="form-group">
                            <label>Symbol</label>
                            <input class="form-control" type="text"  autocomplete="nope">
                        </div>
                        <div class="form-group">
                            <label>Legal Type</label>
                            <input class="form-control" type="text"  autocomplete="nope">
                        </div>
                        <div class="form-group">
                            <label>Industry</label>
                            <input class="form-control" type="text"  autocomplete="nope">
                        </div>
                        <div class="form-group">
                            <label>City</label>
                            <input class="form-control" type="text" [(ngModel)]="city" autocomplete="nope">
                        </div>
                        <div class="form-group">
                            <label>State</label>
                            <input class="form-control" type="text" [(ngModel)]="state" autocomplete="nope">
                        </div>
                        <div class="form-group">
                            <label>Country</label>
                            <input class="form-control" type="text" [(ngModel)]="country" autocomplete="nope">
                        </div>
                        <div class="form-group">
                            <label>Number of Staff</label>
                            <input class="form-control" type="text" [(ngModel)]="numberOfStaff" autocomplete="nope">
                        </div>
                        <div class="form-group">
                            <label>Date Established</label>
                            <input class="form-control" type="date" [(ngModel)]="dateEstablished" autocomplete="nope">
                        </div>
                        <div class="form-group">
                            <label>Notes</label>
                            <input class="form-control" type="text" [(ngModel)]="notes" autocomplete="nope">
                        </div>
                        <div class="form-group">
                            <div class="form-group">
                                <label for="exampleSelect1">Select Time Zone</label>
                                <select class="form-control" >
                                    <option></option>
                                    <option>+03:00</option>
                                    <option>+03:00</option>
                                    <option>+03:00</option>
                                    <option>+03:00</option>
                                    <option>+03:00</option>
                                    <option>+03:00</option>
                                </select>
                            </div>
                        </div>
                    </div>                   
                    <div class="col-lg-3">   
                        <div class="form-group">
                            <label>Logo</label>
                            <input class="form-control" type="file"  autocomplete="nope">
                        </div>
                        <div class="form-group">
                            <label>TIN</label>
                            <input class="form-control" type="text"  autocomplete="nope">
                        </div>
                        <div class="form-group">
                            <label>VRN</label>
                            <input class="form-control" type="text"  autocomplete="nope">
                        </div>                      
                    </div>
                    <div class="col-lg-3">
                        <div class="form-group">
                            <label>Physical Address</label>
                            <input class="form-control" type="text" [(ngModel)]="physicalAddress" autocomplete="nope">
                        </div>
                        <div class="form-group">
                            <label>Post Code</label>
                            <input class="form-control" type="text" [(ngModel)]="postalCode" autocomplete="nope">
                        </div>
                        <div class="form-group">
                            <label>Post Address</label>
                            <input class="form-control" type="text" [(ngModel)]="postalAddress" autocomplete="nope">
                        </div>
                    </div>
                    <div class="col-lg-3">
                        <div class="form-group">
                            <label>Telephone</label>
                            <input class="form-control" type="tel" [(ngModel)]="telephone" autocomplete="nope">
                        </div>
                        <div class="form-group">
                            <label>Mobile</label>
                            <input class="form-control" type="tel" [(ngModel)]="mobile" autocomplete="nope">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input class="form-control" type="email" [(ngModel)]="email">
                        </div>
                        <div class="form-group">
                            <label>Website</label>
                            <input class="form-control" type="text" [(ngModel)]="website" autocomplete="nope">
                        </div>
                        <div class="form-group">
                            <label>Fax</label>
                            <input class="form-control" type="tel" [(ngModel)]="fax" autocomplete="nope">
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-dismiss="modal" (click)="save()">Save</button>
                <button type="button" class="btn btn-danger" data-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>
