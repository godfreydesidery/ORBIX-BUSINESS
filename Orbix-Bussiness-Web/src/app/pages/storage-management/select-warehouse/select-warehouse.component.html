<div class="col">
    <div widget class="card">
        <div class="card-header">
            <span>Warehouse: {{ selectedWarehouse?.name || '' }}</span>
        </div>
        <div class="card-body widget-body text-white">
            <div class="row" *ngIf="warehouseLoaded == false">
                <div class="col-md-3"></div>
                <div class="col-md-6">

                    <br><br>

                    <div class="form-group">
                        <select class="form-control" [(ngModel)]="selectedWarehouseId" (change)="onWarehouseChange($event)">
                            <option value=''></option>
                            <option *ngFor="let warehouse of availableWarehouses" [value]="warehouse.id"
                                style="font-size: larger;"><b>{{warehouse.name}}</b></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <button type="button" class="btn btn-success btn-round-custom" (click)="selectWarehouse()"
                            style="width: 25%;">Select</button>
                        <button type="button" class="btn btn-danger btn-round-custom pull-right"
                            (click)="clearSelectedWarehouse()">Cancel</button>
                    </div>
                </div>
                <div class="col-md-3"></div>
            </div>
            <div class="row" *ngIf="warehouseLoaded == true">
                <div class="col-lg-12">
                    <button class="btn btn-success btn-round-custom">Registration</button>
                    <button class="btn btn-success btn-round-custom">Storage</button>
                </div>
            </div>
        </div>
    </div>
</div>
